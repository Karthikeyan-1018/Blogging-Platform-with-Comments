# Database Configuration (externalized via environment variables with demo defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/demo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings (override via environment variables in any non-demo environment)
blogging.jwt.secret=${BLOGGING_JWT_SECRET:9a67471ec6352487ae09ec16182c16182c16182c16182c16182c16182c16182c}
blogging.jwt.expirationMs=${JWT_EXPIRATION_MS:14400000}
blogging.jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# CORS Allowed Origins (comma separated) - defaults for local development
blogging.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Swagger OpenAPI Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Enable standard spring security user creation logs to be off
spring.main.banner-mode=off
logging.level.org.springframework.security=INFO
