services:
  mysql:
    image: mysql:8.4
    container_name: blog_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: demo
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: blog_backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/demo
      DB_USERNAME: root
      DB_PASSWORD: rootpass123
      BLOGGING_JWT_SECRET: change-me-to-a-long-random-secret-in-production-1234567890
      JWT_EXPIRATION_MS: "14400000"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: blog_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-uploads: